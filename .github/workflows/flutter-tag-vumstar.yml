name: Flutter Tag Build VUMSTAR

on:
  workflow_dispatch:
    inputs:
      upload_tag:
        description: 'Release tag name for manual builds'
        required: false
        type: string
        default: 'sos-nightly'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build-vumstar.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload_tag || github.ref_name }}
